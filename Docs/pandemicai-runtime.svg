<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="824" viewBox="0 0 1160 824" role="img" aria-labelledby="title desc">
<title id="title">PandemicAI framework architecture</title>
<desc id="desc">The touch board and game engine supply state to a turn planner and queue gameplay events. The planner sends a goal and action queue to an embodied teammate. The event timeline also notifies the teammate, whose speech callbacks can send clicks and drags back to the board. Game events and robot commands are recorded separately. The game and planner also support simulation without a robot.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L9 5 L0 10 L2.4 5 Z" fill="#425970"/></marker><marker id="return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L9 5 L0 10 L2.4 5 Z" fill="#146d68"/></marker></defs>
<rect x="0" y="0" width="1160" height="824" rx="0" fill="#fff" stroke="none" stroke-width="1"/>
<text x="34" y="48" text-anchor="start" fill="#142e43" font-family="Liberation Sans, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="0">PandemicAI framework</text>
<text x="35" y="78" text-anchor="start" fill="#29465d" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" letter-spacing="0">A shared board for human–robot play and for running the planner in simulation.</text>
